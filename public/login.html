<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Quản trị - Vườn Thuốc Nam</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div style="max-width: 440px; margin: 100px auto; padding: 36px 28px; background: white; border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); text-align: center; border: 1px solid #dce8dc;">
        <div style="font-size: 40px; margin-bottom: 10px;">🌿</div>
        <h2 style="color: #2e7d32; margin: 0 0 10px 0;">Khu Vực Quản Trị Viên</h2>
        <p style="color: #555; font-size: 14.5px; line-height: 1.5; margin-bottom: 24px;">Vui lòng đăng nhập bằng tài khoản được cấp quyền để thêm, sửa, xóa dữ liệu dược liệu.</p>
        
        <button id="btn-login-google" style="width: 100%; padding: 13px 20px; background-color: #4285F4; color: white; border: none; border-radius: 8px; font-family: inherit; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 3px 8px rgba(66, 133, 244, 0.3);">
            Đăng nhập bằng Google
        </button>

        <div style="margin-top: 22px; padding-top: 16px; border-top: 1px solid #eee;">
            <a href="index.html" style="color: #2e7d32; text-decoration: none; font-weight: 600; font-size: 14px;">← Quay lại Trang chủ</a>
        </div>
    </div>

    <script type="module" src="login.js"></script>
</body>
</html>
